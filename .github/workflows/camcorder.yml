name: UnityCamcorder 빌드

# 캠코더(BepInEx 플러그인 + C# 캠코더 + 창 프로그램)를 Windows에서 빌드해 배포용 zip으로 묶습니다.
on:
  push:
    branches: ["**"]
    paths:
      - "Camcorder/**"
      - ".github/workflows/camcorder.yml"
  workflow_dispatch:

env:
  # 앱 폴더에 설치해 줄 BepInEx 5 (공식 배포본을 받아 해시를 확인한 뒤 그대로 넣음)
  BEPINEX_VERSION: "5.4.23.6"
  BEPINEX_SHA256_X64: "6c57a714a892efb4e9e1fef63d608a3391f30ec984031c465404e4ee381a0755"
  BEPINEX_SHA256_X86: "a4024dafaca5d3784097e34b3c2921415030c0b461e52f30053ed8914be9622d"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # --- BepInEx 플러그인 (앱 안에서 도는 부분, .NET 3.5) ---
      # 배포용은 지원하는 가장 오래된 Unity 2018.1.9 참조로 빌드
      - name: 플러그인 빌드
        run: dotnet build Camcorder/Plugin/UnityCamcorderPlugin.csproj -c Release -o Camcorder/build/plugin

      # 쓰는 유니티 API가 2018.1부터 최신(6000.6)까지 모두 있는지: 여러 버전의 유니티 참조로 컴파일해 봄 (결과물은 버림)
      # Unity 2022.3 이후 참조 DLL은 netstandard 2.1 기반이라 UnityApiCheck로 그 틀에서 컴파일
      - name: 플러그인 유니티 버전 호환 확인
        shell: pwsh
        run: |
          $net35 = @("2018.4.36", "2019.4.40", "2020.3.48", "2021.3.45")
          $netstd = @("2022.3.62", "6000.0.58", "6000.6.6")
          foreach ($v in $net35) {
            Write-Host "=== Unity $v"
            dotnet build Camcorder/Plugin/UnityCamcorderPlugin.csproj -c Release "-p:UnityVersion=$v" -o "Camcorder/build/check/$v" -warnaserror
            if ($LASTEXITCODE -ne 0) { throw "Unity $v 참조로 플러그인 컴파일 실패" }
          }
          foreach ($v in $netstd) {
            Write-Host "=== Unity $v"
            dotnet build Camcorder/Plugin/UnityCamcorderPlugin.csproj -c Release -p:UnityApiCheck=true "-p:UnityVersion=$v" -o "Camcorder/build/check/$v" -warnaserror
            if ($LASTEXITCODE -ne 0) { throw "Unity $v 참조로 플러그인 컴파일 실패" }
          }

      # --- C# 캠코더 (단일 파일, 자체 포함) ---
      - name: 캠코더 publish
        run: dotnet publish Camcorder/Controller/UnityCamcorder.csproj -c Release -o Camcorder/dist

      # --- 창 프로그램 (UnityCamcorder.exe를 실행·관리하고 플러그인을 설치하는 GUI, .NET Framework 4.8) ---
      - name: 창 프로그램 publish
        run: dotnet publish Camcorder/Gui/UnityCamcorderGui.csproj -c Release -o Camcorder/dist

      # --- BepInEx 5 공식 배포본 (앱 폴더에 처음 한 번 설치) ---
      - name: BepInEx 받기
        shell: pwsh
        run: |
          $dir = "Camcorder/dist/bepinex"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $v = $env:BEPINEX_VERSION
          foreach ($arch in @("x64", "x86")) {
            $name = "BepInEx_win_${arch}_$v.zip"
            $path = Join-Path $dir $name
            Invoke-WebRequest -Uri "https://github.com/BepInEx/BepInEx/releases/download/v$v/$name" -OutFile $path
            $expected = if ($arch -eq "x64") { $env:BEPINEX_SHA256_X64 } else { $env:BEPINEX_SHA256_X86 }
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            Write-Host "$name SHA256: $actual"
            if ($actual -ne $expected) { throw "$name 해시가 다릅니다 (기대 $expected)" }
          }
          # BepInEx는 LGPL-2.1: 라이선스 원문을 함께 넣음
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/BepInEx/BepInEx/v$v/LICENSE" -OutFile (Join-Path $dir "LICENSE-BepInEx.txt")

      # --- 배포 폴더 구성 ---
      - name: 배포 폴더 구성
        shell: pwsh
        run: |
          $dist = "Camcorder/dist"
          New-Item -ItemType Directory -Force -Path "$dist/plugin" | Out-Null
          Copy-Item Camcorder/build/plugin/UnityCamcorderPlugin.dll "$dist/plugin/"
          Copy-Item Camcorder/README.md "$dist/"
          Copy-Item Camcorder/THIRD-PARTY-NOTICES.md "$dist/"
          Copy-Item Camcorder/camcorder.sample.json "$dist/camcorder.json"
          Remove-Item "$dist/*.pdb" -ErrorAction SilentlyContinue

      # --- (선택) 코드 서명: 저장소 시크릿에 인증서가 있을 때만 우리 실행 파일·DLL에 서명 ---
      # BepInEx는 zip 안에 공식 배포본 그대로 두므로 서명 대상이 아닙니다.
      # 서명 인증서(.pfx)를 base64로 인코딩해 SIGN_PFX_BASE64 시크릿에, 비밀번호를 SIGN_PFX_PASSWORD 시크릿에
      # 넣으면 빌드마다 자동으로 서명됩니다. 시크릿이 없으면 이 단계는 그냥 건너뜁니다(빌드는 그대로 성공).
      - name: 코드 서명 (인증서 시크릿이 있을 때만)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ secrets.SIGN_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64)) {
            Write-Host "서명 인증서 시크릿(SIGN_PFX_BASE64)이 없어 코드 서명을 건너뜁니다."
            exit 0
          }
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe를 찾지 못했습니다 (Windows SDK)." }
          Write-Host "signtool: $($signtool.FullName)"
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $ts = if ([string]::IsNullOrWhiteSpace($env:SIGN_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:SIGN_TIMESTAMP_URL }
          $files = Get-ChildItem "Camcorder/dist" -Recurse -Include *.exe,*.dll | Select-Object -ExpandProperty FullName
          foreach ($f in $files) {
            Write-Host "서명: $f"
            & $signtool.FullName sign /fd sha256 /tr $ts /td sha256 /f $pfx /p $env:SIGN_PFX_PASSWORD $f
            if ($LASTEXITCODE -ne 0) { throw "서명 실패: $f" }
            & $signtool.FullName verify /pa $f
            if ($LASTEXITCODE -ne 0) { throw "서명 검증 실패: $f" }
          }
          Remove-Item $pfx -Force

      # 파일 해시 목록 (서명 뒤에 계산)
      - name: 해시 목록
        shell: pwsh
        run: |
          $dist = "Camcorder/dist"
          $root = (Resolve-Path $dist).Path
          Get-ChildItem $dist -Recurse -File -Include *.exe,*.dll,*.zip |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.FullName.Substring($root.Length + 1).Replace('\','/') } |
            Sort-Object | Set-Content "$dist/checksums.txt" -Encoding utf8
          Get-Content "$dist/checksums.txt"

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: UnityCamcorder
          path: Camcorder/dist/**

name: UnityCamcorder 빌드

# 외부 캠코더(주입 DLL + 주입기 + C# 캠코더 + 창 프로그램)를 Windows에서 빌드해 배포용 zip으로 묶습니다.
on:
  push:
    branches: ["**"]
    paths:
      - "Camcorder/**"
      - ".github/workflows/camcorder.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # --- 네이티브(DLL + 주입기)를 MSVC로 x64/x86 각각 빌드 ---
      - name: 네이티브 x64 빌드
        run: |
          cmake -S Camcorder/Native -B Camcorder/Native/build-x64 -A x64
          cmake --build Camcorder/Native/build-x64 --config Release

      - name: 네이티브 x86 빌드
        run: |
          cmake -S Camcorder/Native -B Camcorder/Native/build-x86 -A Win32
          cmake --build Camcorder/Native/build-x86 --config Release

      # --- C# 캠코더 (단일 파일, 자체 포함) ---
      - name: 캠코더 publish
        run: dotnet publish Camcorder/Controller/UnityCamcorder.csproj -c Release -o Camcorder/dist

      # --- 창 프로그램 (UnityCamcorder.exe를 실행·관리하는 GUI, .NET Framework 4.8) ---
      - name: 창 프로그램 publish
        run: dotnet publish Camcorder/Gui/UnityCamcorderGui.csproj -c Release -o Camcorder/dist

      # --- 배포 폴더 구성 ---
      - name: 배포 폴더 구성
        shell: pwsh
        run: |
          $dist = "Camcorder/dist"
          New-Item -ItemType Directory -Force -Path "$dist/x64","$dist/x86" | Out-Null
          Copy-Item Camcorder/Native/build-x64/Release/UnityCamcorderHook.dll "$dist/x64/"
          Copy-Item Camcorder/Native/build-x64/Release/Inject.exe "$dist/x64/"
          Copy-Item Camcorder/Native/build-x86/Release/UnityCamcorderHook.dll "$dist/x86/"
          Copy-Item Camcorder/Native/build-x86/Release/Inject.exe "$dist/x86/"
          Copy-Item Camcorder/README.md "$dist/"
          Copy-Item Camcorder/camcorder.sample.json "$dist/camcorder.json"
          Remove-Item "$dist/*.pdb" -ErrorAction SilentlyContinue

      # --- (선택) 코드 서명: 저장소 시크릿에 인증서가 있을 때만 모든 실행 파일·DLL에 서명 ---
      # Authenticode 서명은 ML/휴리스틱 오탐과 SmartScreen 경고를 줄이는 가장 효과적인 정식 방법입니다.
      # 서명 인증서(.pfx)를 base64로 인코딩해 SIGN_PFX_BASE64 시크릿에, 비밀번호를 SIGN_PFX_PASSWORD 시크릿에
      # 넣으면 빌드마다 자동으로 서명됩니다. 시크릿이 없으면 이 단계는 그냥 건너뜁니다(빌드는 그대로 성공).
      - name: 코드 서명 (인증서 시크릿이 있을 때만)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ secrets.SIGN_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64)) {
            Write-Host "서명 인증서 시크릿(SIGN_PFX_BASE64)이 없어 코드 서명을 건너뜁니다."
            Write-Host "백신 오탐을 크게 줄이려면 코드 서명 인증서(.pfx)를 base64로 SIGN_PFX_BASE64 시크릿에,"
            Write-Host "비밀번호를 SIGN_PFX_PASSWORD 시크릿에 등록하세요. (설정 > Secrets and variables > Actions)"
            exit 0
          }
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\x64\\" } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe를 찾지 못했습니다 (Windows SDK)." }
          Write-Host "signtool: $($signtool.FullName)"
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $ts = if ([string]::IsNullOrWhiteSpace($env:SIGN_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:SIGN_TIMESTAMP_URL }
          $files = Get-ChildItem "Camcorder/dist" -Recurse -Include *.exe,*.dll | Select-Object -ExpandProperty FullName
          foreach ($f in $files) {
            Write-Host "서명: $f"
            & $signtool.FullName sign /fd sha256 /tr $ts /td sha256 /f $pfx /p $env:SIGN_PFX_PASSWORD $f
            if ($LASTEXITCODE -ne 0) { throw "서명 실패: $f" }
            & $signtool.FullName verify /pa $f
            if ($LASTEXITCODE -ne 0) { throw "서명 검증 실패: $f" }
          }
          Remove-Item $pfx -Force

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: UnityCamcorder
          path: Camcorder/dist/**
